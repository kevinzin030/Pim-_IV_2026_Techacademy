<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechAcademy - Autenticação</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#070f1e',
                            navy: '#102a45',
                            blue: '#2563eb',
                            light: '#e0f2fe'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-brand-dark min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden font-sans">

    <!-- Container do Toast Notification -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-md"></div>

    <!-- Background Decorativo (com travas de overflow e ponteiros desativados) -->
    <div class="absolute -top-24 -left-24 w-72 h-72 sm:w-96 sm:h-96 bg-brand-blue/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-72 h-72 sm:w-96 sm:h-96 bg-blue-400/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md mx-auto relative z-10 my-auto">
        <!-- Card de Login -->
        <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-100 w-full">
            <div class="text-center mb-6 sm:mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 sm:w-16 sm:h-16 bg-brand-dark text-brand-blue rounded-2xl mb-3 sm:mb-4 shadow-lg border border-slate-700">
                    <i class="fa-solid fa-graduation-cap text-2xl sm:text-3xl text-blue-400"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold text-brand-dark">TechAcademy</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Plataforma Acadêmica Inteligente</p>
            </div>

            <!-- Alternador de Perfil -->
            <div class="bg-slate-100 p-1 rounded-xl flex mb-6">
                <button type="button" id="role-btn-professor" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all shadow-sm bg-white text-brand-dark cursor-pointer">
                    <i class="fa-solid fa-chalkboard-user mr-1"></i> Professor (RP)
                </button>
                <button type="button" id="role-btn-aluno" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-brand-dark transition-all cursor-pointer">
                    <i class="fa-solid fa-user-graduate mr-1"></i> Aluno (RA)
                </button>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label id="login-label" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">RP (Registro de Professor)</label>
                    <div class="relative">
                        <i id="login-icon" class="fa-solid fa-id-card absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                        <input type="text" id="login-identifier" required class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 text-sm transition" placeholder="Digite seu RP">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Senha</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                        <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 text-sm transition" placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-slate-500">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked class="rounded border-slate-300 text-brand-blue focus:ring-brand-blue">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#" id="forgot-password" class="text-brand-blue hover:underline">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="w-full py-3.5 bg-brand-blue hover:bg-brand-navy text-white font-bold rounded-xl transition shadow-lg hover:shadow-xl flex items-center justify-center gap-2 text-sm sm:text-base cursor-pointer">
                    <span>Entrar na Plataforma</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
