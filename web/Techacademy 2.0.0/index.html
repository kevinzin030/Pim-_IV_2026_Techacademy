<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechAcademy - Autenticação</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-brand-dark min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans">

    <!-- Container do Toast Notification -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-md"></div>

    <!-- Background Decorativo -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-brand-blue/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-blue-400/10 rounded-full blur-3xl"></div>

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 relative z-10 border border-slate-100">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-brand-dark text-brand-blue rounded-2xl mb-4 shadow-lg border border-slate-700">
                <i class="fa-solid fa-graduation-cap text-3xl text-blue-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-brand-dark">TechAcademy</h1>
            <p class="text-sm text-slate-500 mt-1">Plataforma Acadêmica Inteligente</p>
        </div>

        <!-- Alternador de Perfil -->
        <div class="bg-slate-100 p-1 rounded-xl flex mb-6">
            <button type="button" id="role-btn-professor" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all shadow-sm bg-white text-brand-dark">
                <i class="fa-solid fa-chalkboard-user mr-1"></i> Professor
            </button>
            <button type="button" id="role-btn-aluno" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-brand-dark transition-all">
                <i class="fa-solid fa-user-graduate mr-1"></i> Aluno
            </button>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">E-mail ou Usuário</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    <input type="text" id="login-email" required class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 text-sm transition" placeholder="seu.email@techacademy.edu">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Senha</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 text-sm transition" placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-slate-500">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded border-slate-300 text-brand-blue focus:ring-brand-blue">
                    <span>Lembrar-me</span>
                </label>
                <a href="#" id="forgot-password" class="text-brand-blue hover:underline">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="w-full py-3 bg-[#102a45] hover:bg-[#070f1e] text-white font-semibold rounded-xl transition shadow-lg hover:shadow-xl flex items-center justify-center gap-2" style="background-color: #102a45 !important; color: #ffffff !important;">
    <span>Entrar na Plataforma</span>
    <i class="fa-solid fa-arrow-right text-sm"></i>
</button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-400">
            <i class="fa-solid fa-circle-info mr-1 text-brand-blue"></i> Protótipo acadêmico com suporte a 10 Heurísticas de Nielsen.
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
